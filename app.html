<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TravelTropia</title>
  <meta name="description" content="Plan itineraries, travel with friends and track every country you visit.">
  <meta name="theme-color" content="#F6F4EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14201F" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app" id="app"><div class="boot">Loading TravelTropia…</div></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="firebase-config.js"></script>         <!-- your Firebase keys (empty = offline mode) -->
  <script src="assets/vendor/leaflet/leaflet.js" defer></script> <!-- Leaflet (street maps) -->
  <script src="assets/js/libs.js" defer></script>    <!-- d3-geo + topojson (maps) -->
  <script src="assets/js/data.js" defer></script>    <!-- countries, destinations, visa/safety, trivia -->
  <script src="assets/js/cities.js" defer></script>  <!-- 14,800 world cities for search (GeoNames) -->
  <script src="assets/js/script.js" defer></script>  <!-- the app -->
</body>
</html>
